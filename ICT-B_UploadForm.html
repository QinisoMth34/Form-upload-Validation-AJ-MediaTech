<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomentFilm - Video Upload Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            font-family: 'DM Sans', Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #1b1b1b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffb347;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #888;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
            font-family: 'DM Sans', Arial, sans-serif;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #ffb347;
            box-shadow: 0 0 8px rgba(255, 179, 71, 0.2);
        }

        input::placeholder {
            color: #666;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 14px;
            background: #2a2a2a;
            border: 1px dashed #444;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            color: #888;
        }

        .file-input-label:hover {
            border-color: #ffb347;
            background: #333;
        }

        .file-input-label.has-file {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ff8c00;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            background: #e67e00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Error Messages */
        .error-message {
            display: none;
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 4px;
            border-left: 3px solid #ff6b6b;
        }

        .error-message.show {
            display: block;
        }

        .form-group.error input,
        .form-group.error select {
            border-color: #ff6b6b;
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            text-align: center;
            background: #1b1b1b;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #ffb347;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ffb347;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .success-message {
            display: none;
            color: #4CAF50;
            font-size: 13px;
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MomentFilm</h1>
        <p class="subtitle">Upload Your Video Content</p>

        <form id="uploadForm">
            <!-- File Upload -->
            <div class="form-group">
                <label for="videoFile">Upload Video File</label>
                <div class="file-input-wrapper">
                    <input type="file" id="videoFile" name="videoFile" accept=".mp4,.mov,.avi,.webm">
                    <label for="videoFile" class="file-input-label" id="fileLabel">
                        📁 Choose video file (MP4, MOV, AVI, WebM)
                    </label>
                </div>
                <div class="error-message" id="fileError"></div>
                <div class="success-message" id="fileSuccess"></div>
            </div>

            <!-- Customer Name -->
            <div class="form-group">
                <label for="customerName">Your Name</label>
                <input 
                    type="text" 
                    id="customerName" 
                    name="customerName" 
                    placeholder="Enter your full name"
                    required
                >
                <div class="error-message" id="nameError"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your.email@example.com"
                    required
                >
                <div class="error-message" id="emailError"></div>
            </div>

            <!-- WhatsApp Number -->
            <div class="form-group">
                <label for="whatsappNumber">WhatsApp Number</label>
                <input 
                    type="tel" 
                    id="whatsappNumber" 
                    name="whatsappNumber" 
                    placeholder="+2781 234 5678 / 071 234 5678"
                    required
                >
                <div class="error-message" id="phoneError"></div>
            </div>

            <!-- Mood Dropdown -->
            <div class="form-group">
                <label for="mood">Video Mood / Genre</label>
                <select id="mood" name="mood" required>
                    <option value="">-- Select a mood --</option>
                    <option value="action">Action</option>
                    <option value="comedy">Comedy</option>
                    <option value="drama">Drama</option>
                    <option value="documentary">Documentary</option>
                    <option value="animation">Animation</option>
                    <option value="experimental">Experimental</option>
                    <option value="other">Other</option>
                </select>
                <div class="error-message" id="moodError"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">Upload Video</button>
        </form>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Uploading your video...</p>
        </div>
    </div>

    <script src="validation.js"></script>
</body>
</html>
